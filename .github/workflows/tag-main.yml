name: Tag main after merge
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag: {description: "Tag name, e.g. v2026-11-16-short-name", required: true}
      sha: {description: "Commit on main", required: true}
permissions:
  contents: write
jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          IN_TAG: ${{ inputs.tag }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$IN_TAG" ]; then TAG="$IN_TAG"; SHA="$IN_SHA"
          else
            TAG=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -oE '^Tag: *v[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+' | head -1 | sed 's/^Tag: *//')
            SHA="$MERGE_SHA"
          fi
          if [ -z "$TAG" ]; then echo "No 'Tag:' line; no tag made."; exit 0; fi
          echo "$TAG" | grep -Eq '^v[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$' || { echo "Bad tag name: $TAG"; exit 1; }
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
          echo "Tag $TAG created at $SHA"
