<style>

/* Düzen: üstte başlık bandı, yapışkan modül sekmeleri; her modül = solda kontrol + yol + grafik, sağda "Ne oluyor?" + ders notu */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#E8EEF8; --ink:#0E1A33; --muted:#566381; --line:#D3DCEB;
  --navy:#0B2A6B; --signal:#B3122E; --ok:#0F7A5F; --warn:#B45309;
  --h1:#2457C5; --h2:#C2410C; --h3:#0F7A5F; --h4:#8E2E6B; --h5:#6B4FD3;
  --band:rgba(15,122,95,.12); --grid:rgba(14,26,51,.08);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#121C31; --surface-2:#1A2742; --ink:#E5ECF8; --muted:#9BA9C4; --line:#28385A;
  --navy:#9DB8FF; --signal:#FF6F86; --ok:#4CD3A7; --warn:#F5A453;
  --h1:#7FA6FF; --h2:#FF9A63; --h3:#4CD3A7; --h4:#E28AC2; --h5:#B4A2FF;
  --band:rgba(76,211,167,.14); --grid:rgba(229,236,248,.08); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#121C31; --surface-2:#1A2742; --ink:#E5ECF8; --muted:#9BA9C4; --line:#28385A;
  --navy:#9DB8FF; --signal:#FF6F86; --ok:#4CD3A7; --warn:#F5A453;
  --h1:#7FA6FF; --h2:#FF9A63; --h3:#4CD3A7; --h4:#E28AC2; --h5:#B4A2FF;
  --band:rgba(76,211,167,.14); --grid:rgba(229,236,248,.08); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;color:var(--navy);letter-spacing:-.01em}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--h1);outline-offset:2px}
main .wrap{padding-block:22px 48px}
.view[hidden]{display:none!important}

/* Giriş */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.intro h2{font-size:26px;color:var(--navy);margin-bottom:8px}
.steps{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--navy);font-weight:700;font-family:var(--f-mono)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:22px}
.modcard{all:unset;cursor:pointer;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.modcard:hover{border-color:var(--navy)}
.modcard:focus-visible{outline:3px solid var(--h1);outline-offset:2px}
.modcard strong{font-family:var(--f-display);font-size:19px;color:var(--navy)}
.modcard span{color:var(--muted);font-size:14px}
.modcard em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--signal)}
.btn{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--navy);background:var(--navy);color:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.legendkey{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted)}

/* Modül */
.mod-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:flex-end;margin-bottom:14px}
.mod-head h2{font-size:clamp(24px,3.4vw,32px);color:var(--navy)}
.mod-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.simbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.simbar .btn{padding:7px 11px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:700;border:0;background:var(--surface);color:var(--muted);padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.mod-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.col>*{min-width:0}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ctl{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:12px}
.ctl label,.ctl .lab{font-weight:700;font-size:14px}
.ctl small{color:var(--muted);font-size:12.5px;line-height:1.35}
.ctl input[type=range]{width:100%;accent-color:var(--navy)}
.ctl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ctl .btn{width:100%}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch input:checked{background:var(--navy)}
.switch input:checked::after{left:21px}

.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.path h3,.panel h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:700;margin-bottom:10px}
.prow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.prow + .prow{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.node{flex:1 1 0;min-width:118px;background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:4px;align-content:start}
.node .nl{font-weight:700;font-size:14px;line-height:1.25}
.node .ns{font-size:12px;color:var(--muted);line-height:1.25}
.node .nv{font-family:var(--f-mono);font-size:18px;font-weight:700}
.meter{position:relative;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.state{font-size:12px;font-weight:700}
.state.hi{color:var(--signal)} .state.lo{color:var(--h1)} .state.ok{color:var(--ok)}
.arrow{flex:0 0 26px;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:18px}
.fb{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);color:var(--muted)}
.fb .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:var(--line)}
.fb.on.neg{border-color:var(--h1);color:var(--ink)} .fb.on.neg .dot{background:var(--h1)}
.fb.on.pos{border-color:var(--signal);color:var(--ink)} .fb.on.pos .dot{background:var(--signal)}
.fb.off{opacity:.7}

.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chartbox canvas{width:100%;height:240px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend .v{font-family:var(--f-mono);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.now{font-size:16px}
.now p{margin:0 0 8px}
.now p:last-child{margin-bottom:0}
.now .tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--navy);margin-right:6px}
.note p{margin:0 0 10px;max-width:65ch}
.note ul{margin:0 0 10px;padding-left:20px}
.note strong{color:var(--navy)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tasks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.tasks li::before{content:"→";color:var(--signal);font-weight:700}
.daily{background:color-mix(in srgb,var(--h2) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--h2) 30%,var(--line));border-radius:var(--r);padding:14px 16px;font-size:15px}
.daily b{color:var(--h2)}
.visual{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.progress{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--signal)}
.clock{font-family:var(--f-mono);font-size:34px;font-weight:700;color:var(--navy)}

/* Test */
.quiz{display:grid;gap:14px;max-width:860px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q legend{font-weight:700;font-size:17px;padding:0;margin-bottom:10px}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt input{accent-color:var(--navy);width:18px;height:18px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 10%,var(--surface))}
.why{margin-top:10px;font-size:15px;color:var(--muted)}
.why b{color:var(--ink)}
.why a{color:var(--navy);font-weight:700}
.score{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.score .big{font-family:var(--f-mono);font-size:30px;font-weight:700;color:var(--navy)}
.compare{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:14px;font-weight:700;border-radius:99px;padding:4px 12px;background:var(--surface-2)}

.qtag{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--signal);margin-bottom:4px}
.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ordrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ordrow .pos{font-family:var(--f-mono);font-weight:700;color:var(--navy);text-align:center}
.obtns{display:flex;gap:4px}
.mini{font:inherit;font-weight:700;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.mini:disabled{opacity:.35;cursor:default}
.match{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px}
.mrow select{font:inherit;font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.tfl{display:grid;gap:8px}
.tfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.tfbtns{display:flex;gap:12px;font-weight:700}
.tfbtns label{display:flex;gap:4px;align-items:center;cursor:pointer}
.tfbtns input{accent-color:var(--navy);width:18px;height:18px}
.fix{grid-column:1/-1;font-size:14px;color:var(--muted)}
textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.rubric{display:grid;gap:8px;margin-top:12px;padding:12px;border-radius:10px;background:var(--surface-2)}
.rb{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rb input{accent-color:var(--ok);width:18px;height:18px;margin-top:3px;flex:0 0 auto}
.rb em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ordrow.right,.mrow.right,.tfrow.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.ordrow.wrong,.mrow.wrong,.tfrow.wrong{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 8%,var(--surface))}
@media (max-width:600px){.mrow{grid-template-columns:minmax(0,1fr)}}
.rumuz{display:grid;gap:6px;max-width:860px;margin-bottom:14px}
.rumuz input{font:inherit;font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;text-transform:uppercase;width:9ch;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.rumuz small{color:var(--muted)}
.sendbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
footer{color:var(--muted);font-size:13px;padding-block:0 30px}
@media (max-width:600px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.ctl{padding:10px}.prow{flex-wrap:wrap;gap:8px}.prow .arrow{display:none}.node{flex:1 1 calc(50% - 8px);min-width:0}}
@media (max-width:860px){.mod-grid,.intro{grid-template-columns:minmax(0,1fr)}.chartbox canvas{height:210px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Ekler / additions */
header.top .wrap{align-items:flex-start}
#lang button{font-family:var(--f-mono);min-width:44px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:99px;background:var(--h5)}
.bar em{font-style:normal;font-family:var(--f-mono);font-size:13px;text-align:right}
.note .src{font-size:13px;color:var(--muted);margin-top:6px}
.srclist{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.node .nv.sm{font-size:14px;font-family:var(--f-body)}
.ctl output{font-family:var(--f-mono);font-weight:700;color:var(--navy)}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}


/* 2026-11b test flow */
.qnote{border-left:4px solid var(--navy);font-size:15px}
.qnote .btn{margin-left:6px;padding:6px 12px;font-size:14px}
.blankwarn{margin-bottom:12px;padding:12px;border-radius:10px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.blankwarn p{margin:0 0 10px}
.testnote{margin-bottom:16px;border-left:4px solid var(--warn);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:700}
.rbnote{margin:0;color:var(--warn);font-weight:700}
.wc{display:block;margin-top:4px;color:var(--muted);font-size:13px}
textarea[readonly]{background:var(--surface-2)}
.codeline{font-size:18px;font-weight:700}
.code{font-family:var(--f-mono,monospace);font-size:24px;letter-spacing:.08em;color:var(--navy);margin-left:6px}
.othercode{margin-top:4px;font-size:14px}
.rumuz .othercode input{font:inherit;font-family:var(--f-mono,monospace);width:12ch;letter-spacing:.04em;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-transform:uppercase}
.othercode .btn{padding:6px 12px;font-size:14px}

/* Bloklar / blocks (template 2026-11) */
.ctl.wide{grid-column:1/-1}
.ctl .seg{width:max-content;max-width:100%;flex-wrap:wrap}
.drawbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.drawbox canvas{width:100%;height:260px;display:block}
.blocks{display:grid;gap:16px}
.gauge{display:grid;justify-items:center;gap:2px}
.gauge svg{width:180px;max-width:100%;height:auto;display:block}
.gauge .gv{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--navy);margin-top:-6px}
.gauge small{color:var(--muted);font-size:13px}
.eqbox{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.eqbox .eqf{font-family:var(--f-mono);font-size:20px;font-weight:700;color:var(--navy)}
.eqbox .eqn{font-family:var(--f-mono);font-size:15px}
.eqbox small{color:var(--muted);font-size:13px}

/* Test 2026-11d */
.filltext{line-height:2.2;margin:4px 0 0}
.fblank{display:inline-block;margin:0 4px;border-radius:8px;padding:0 2px}
.fblank select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.fblank.right{outline:2px solid var(--ok)} .fblank.wrong{outline:2px solid var(--signal)}
.conf{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.conf label{display:inline-flex;gap:4px;align-items:center;color:var(--ink)}
.topics{margin-top:12px;padding:12px;border-radius:10px;background:var(--surface-2)}
.topics ul{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.topics small{color:var(--muted)}
.tm{display:inline-block;width:1.6em;text-align:center;font-weight:700}
.tm.ok{color:var(--ok)} .tm.mid{color:var(--warn)} .tm.bad{color:var(--signal)}
.surewrong{margin-top:10px;font-weight:700;color:var(--signal)}
.selfpts{margin:8px 0 0;font-weight:700;color:var(--muted)}
.fbform{margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--line);display:grid;gap:10px}
.fbform small{color:var(--muted)}
.likert{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}

<script>
(function(){
"use strict";
/* =====================================================================
   SİMÜLATÖR ŞABLONU / SIMULATOR TEMPLATE
   Template 2026-11 · test engine 2026-11g · guide: claude/simulator_template.md
   ---------------------------------------------------------------------
   HOW TO MAKE A NEW SIMULATOR
   1. Copy this file. Name it "<Konu> Simülatörü.html" (one file per lecture).
   2. CONFIG (below): COURSE, PFX, SURUM, SHEET_URL, ORDER.
   3. UI (below): change title, eyebrow, lead, path, seeP, seeNote, sample*,
      ph. Every text is a pair {tr:"…", en:"…"}. Keep all other UI texts.
   4. MODULES: delete the example modules M.ornek1–M.ornek4 and write one
      module per part of the lecture (format below). Put their keys in ORDER.
   5. QUIZ: replace the 6 example questions (format under TEST below). Default
      test: 6 automatic items, 84 points: mcq 4 · tf 10 (5 statements) ·
      order 16 (5 steps) · match 15 · fill 15 (5 blanks) · order 24 (mechanism
      chain, 7 steps, on another module than the 16-point order item).
      Total = items + confidence points (−24 to +12) + 4-point gift = 100.
      Points rule (checked in the console): all item points + 2 per automatic
      item + 4 = 100. Give every item a topic (mod = module key).
      QUIZ_MID: mini-quiz rounds, exactly 3 items each, one round per 18–20
      minutes of lecture time (rule 2.12); format at QUIZ_MID in the quiz part.
   6. Facts: check every value in Guyton 15th and Ganong 27th (rule 2.9) and
      give the pages in each module note. Physiology only (rule 2.10).
   7. Test with SHEET_URL "" first: open every tab, take the pre- and the
      post-test, switch TR/EN. Then set SHEET_URL and send one test row.
   Reset the tests in a browser: open the page with #test-sifirla.
   ---------------------------------------------------------------------
   MODULE FORMAT                                     (* = optional)
   M.key={
     tab, eyebrow, title, sub, card   {tr,en}: tab name, small line above the
                                      title, title, subtitle, start-page card
     init:()=>({…})                   starting state S (numbers)
     controls:[…]                     see CONTROLS
     step(s,dt,c){…}                  the model: update s for dt seconds;
                                      c = control values. ap(x,target,tau,dt)
                                      moves x toward target (time constant tau)
     rows:(s,c)=>[[node,…],[node,…]]  pathway boxes, one array per row;
                                      node={l,s,v,c,fmt*,small*}: label, sub-
                                      label, bar 0–1, color token, value text
     fb:(s,c)=>({kind,on,strength,text}) | null   feedback light;
                                      kind "neg" (blue) or "pos" (red)
     series:[{k,n,c,min,max,primary*,axis*,fmt*,band*,bandLabel*,refs*}]
                                      chart lines: k = key in s; [] = no chart
     chart*:{win:15}                  time window in seconds (default 60)
     chart*:{day:true,night:[[0,6],[20,24]]} + dayVals(h,c)=>({k:v,…})
                                      24-hour axis; s.h = hour (0–24)
     now:(s,c)=>[html,…]              "What is happening?" lines; tg() = tag
     visual*:(s,c)=>html              blocks B.* (see BLOCKS)
     draw*:{h:260,fn(g,W,H,s,c){…}}   large drawing area (canvas 2D, g)
     daily {tr,en} · tasks {tr:[…],en:[…]} · note:()=>html + SRC(tr,en)
     predict*:{q:{tr,en}, set:{controlId:value,…}, a:"up"|"down"|"same", why:{tr,en}}
                                      M2 "predict first" box above the controls (PREDICT switch):
                                      question "If Y …, what happens to X?", one try, 0 points; Lock
                                      applies set (like a preset) and runs the module. Use the same
                                      mechanism as one test item of the module in another situation,
                                      with no shared stem (no cue). Book pages go in the module note.
   }
   CONTROLS
     {type:"range",id,label,min,max,step,value,ends:[a,b],show*:v=>"…",help}
     {type:"toggle",id,label,value:false,help}
     {type:"button",id,label,act:(s,c)=>{…},help}
     {type:"preset",id,label,value:0,options:[{label,set:{id:value,…}}],help}
     BOOK_CTL  ready toggle: off = Guyton, on = Ganong; read with bk(c,g,n)
   BLOCKS (return HTML; join several in visual)
     B.gauge(v,{min,max,zones,label,fmt,sub})  half-circle gauge
     B.bars(title,[[label,value,max,color*,text*],…])  bar list
     B.stack(title,[[label,value,color],…])    shares of a whole
     B.counter(n,label,sub)  B.clock(h,sub)  B.progress(f,label)
     B.eq(formula,numbers,note)                equation panel
   TEST (QUIZ, and QUIZ_MID for the mini-quiz rounds)       (* = optional)
     common: {type, pts, mod, q:{tr,en}, why:{tr,en}, tag*}  mod = topic
     mcq    o:{tr:[5 options],en:[…]}, a: index of the right option
     tf     o: 5 statements, a:[true,false,…], fix: corrections, mods*:[topic per statement]
     order  o: 4–7 rows in mixed order, a: row indexes in the right order. Students tap the
            steps in order (tap again to remove a number; steps without a number go to the end)
            (scored by consecutive pairs; pts = 4 × (rows − 1): 4 points per right pair)
     match  left: 4–6 items, o: options (2–3 left over), a: option index per item, mods*
     fill   segs:{tr:[text,text,…]} around the blanks (one piece more than the blanks), 5 blanks,
            blanks:[{o:{tr:[options],en:[…]},a:index},…], mods*
     open   (special cases only; not in the default test)
            rubric: 4 steps, ph*: placeholder. Scored by the lecturer in the Sheet:
            per step full / partial / none = pts/steps · 0.4×that · 0
            (e.g. 40 points, 4 steps: 10 / 4 / 0). Students tick the steps as a
            self-check after the post-test; it is not added to their score.
   SCORING: Total = items + confidence points (M3) + 4-point gift; never below 0, at most 100.
     A coloured box at the top of every test (pre, post, delayed) tells the students the rule.
   SWITCHES (below): TESTS.pre/mid/post/late, LATE_DAYS, CONFIDENCE (M3),
     FEEDBACK (M4, 1–5 form after the post-test), MINUTE (M5, one-minute paper), PREDICT (M2), PROGRAMS.
   MINI-QUIZ (TESTS.mid): QUIZ_MID = list of rounds, 3 items each, Kahoot style; format at QUIZ_MID in the quiz part.
   QR LINKS: <simulator link>#pre, #post open that test; #mid1, #mid2 … open that mini-quiz round (#mid = round 1).
   LEADERBOARD: <simulator link>#board1, #board2 … on the projector, one per round (#board = round 1; lecturer only;
     needs SHEET_URL and Apps Script 2026-11g).
   ===================================================================== */

/* ---------------- AYARLAR / CONFIG ---------------- */
const COURSE="hemolysis-buffer";   // Sheet tab name (English, lower case), e.g. "respiration"
const PFX="hmb";           // browser storage prefix, 2–5 letters, unique per simulator
const SURUM="hmb-2026-11-12";    // version sent with each result; change it when the test changes
const SHEET_URL="https://script.google.com/macros/s/AKfycbzfIUIU-sczvJPGUjR4El7rH4OUNUcMupt07RNCQ1Vok-51ib1nOfsyjZ3tXLDe3RQp/exec";        // Apps Script web app URL (…/exec); "" = results are not sent
const ORDER=["tonisite","frajilite","tampon","ph"];   // module keys, in tab order
/* assessment switches (true = on) */
const TESTS={pre:true, mid:true, post:true, late:true};  // mid = M6 mini-quiz rounds (Kahoot style, QUIZ_MID: 3 items per round; one round every 18–20 minutes of lecture time, rule 2.12; set false to switch it off); late = M1 delayed test
const LATE_DAYS=14;        // the delayed test opens this many days after the student's post-test
const CONFIDENCE=true;     // M3: "Are you sure?" under each automatic item; "sure" = +2·s − 4·(1 − s) (s = item score share), "not sure" / no mark = 0 (−24 to +12)
const FEEDBACK=true;       // M4: four 1–5 statements after the post-test
const MINUTE=true;         // M5: one-minute paper after the post-test
const PREDICT=true;        // M2: "predict first" box in modules that have predict:{…} (2–3 tasks per simulator, one per main module)
/* programs (faculty / language) asked once per browser and sent as the "Program" column; [] = do not ask.
   PLACEHOLDER list: replace it with the user's list. */
const PROGRAMS=[{k:"tip-tr",tr:"Tıp (Türkçe)",en:"Medicine (Turkish)"},{k:"tip-en",tr:"Tıp (İngilizce)",en:"Medicine (English)"},{k:"diger",tr:"Diğer",en:"Other"}];
const BOARD_TOP=5;           // leaderboard (#board on the projector): number of places shown; equal points share a place
const MINW=10, KST=PFX+"-t4";

const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ap=(x,t,tau,dt)=>x+(t-x)*Math.min(1,dt/tau);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let LANG=(()=>{let l=null;try{l=new URLSearchParams(location.search).get("lang");}catch(e){} if(l!=="en"&&l!=="tr") l=store.get(PFX+"-lang"); return l==="en"?"en":"tr";})();
const L=(tr,en)=>LANG==="en"?en:tr;
const t=x=>x==null?"":(typeof x!=="object"||Array.isArray(x))?x:(x[LANG]!==undefined?x[LANG]:x.tr);
const pct=v=>{const n=Math.round(v*100); return LANG==="en"?n+"%":"%"+n;};
const dec=(v,d=1)=>{const s=v.toFixed(d); return LANG==="en"?s:s.replace(".",",");};

/* ---------------- ARAYÜZ METİNLERİ / UI TEXT ---------------- */
const UI={
  /* --- change these for each simulator --- */
  title:{tr:"Hemoliz ve Tamponlama Simülatörü",en:"Hemolysis and Buffering Simulator"},
  eyebrow:{tr:"Hemoliz, Osmotik Frajilite ve Tamponlama (pratik) · Tıp Fakültesi 1–2. sınıf",en:"Hemolysis, Osmotic Fragility and Buffering (practical) · Medicine, years 1–2"},
  lead:{tr:"Laboratuvardaki deneyleri ekranda tekrarlayın: eritrositleri farklı çözeltilere koyun, osmotik frajiliteyi ölçün ve plazmanın tampon gücünü damla damla test edin.",en:"Repeat the lab experiments on screen: place red cells in different solutions, measure osmotic fragility, and test the buffer power of plasma drop by drop."},
  path:{tr:"Yol",en:"Pathway"},
  howP:{tr:"Her modül konunun bir bölümünü canlandırır. Değerler gerçek zamanlı hesaplanır; yaptığınız her değişikliğin sonucunu birkaç saniye içinde görürsünüz.",en:"Each module animates one part of the topic. Values are calculated in real time, so you see the result of every change within a few seconds."},
  seeP:{tr:"Her basamak bir kutuda gösterilir. Çubuk, düzeyi gösterir.",en:"Each step is shown in a box. The bar shows the level."},
  seeNote:{tr:"Hücre hacmi normalin katı (×), hemoliz parçalanan hücrelerin yüzdesi, osmolarite mOsm/L, HCO₃⁻ mmol/L, Pco₂ mm Hg olarak gösterilir.",en:"Cell volume is shown as times normal (×), hemolysis as the percentage of cells lysed, osmolarity in mOsm/L, HCO₃⁻ in mmol/L, and Pco₂ in mm Hg."},
  sampleL:{tr:"Hemoliz",en:"Hemolysis"}, sampleS:{tr:"Parçalanan hücre",en:"Cells lysed"}, sampleV:{tr:"%50",en:"50%"},
  ph:{tr:"Örneğin: Üre hücreye girer → … → …",en:"For example: urea enters the cell → … → …"},
  /* --- usually unchanged --- */
  tabStart:{tr:"Başla",en:"Start"}, tabTest:{tr:"Ön / son test",en:"Pre / post test"},
  howTitle:{tr:"Nasıl kullanılır?",en:"How to use it"},
  st1:{tr:"<b>Önce ön testi çözün.</b> 6 soru, 5 farklı soru türü. Not için değil, neyi bildiğinizi görmek için.",en:"<b>Take the pre-test first.</b> 6 questions, 5 question types. It is not graded; it shows what you already know."},
  st2:{tr:"<b>Bir modül seçin.</b> Düğmelere basın, kaydırıcıyı oynatın.",en:"<b>Choose a module.</b> Press the buttons and move the slider."},
  st3:{tr:"<b>“Ne oluyor?” kutusunu okuyun.</b> Ekranda olanı adım adım açıklar.",en:"<b>Read the “What is happening?” box.</b> It explains the screen step by step."},
  st4:{tr:"<b>Ders notunu okuyun ve görevleri yapın,</b> sonra son testi çözüp puanınızı karşılaştırın.",en:"<b>Read the lecture note and do the tasks,</b> then take the post-test and compare your scores."},

/* ---------------- YARDIMCILAR / HELPERS ---------------- */
const tg=(tr,en)=>`<span class='tag'>${L(tr,en)}</span>`;
const SRC=(tr,en)=>`<p class="src">${L(tr,en)}</p>`;
const BOOK_CTL={type:"toggle",id:"book",label:{tr:"Ganong değerlerini kullan",en:"Use Ganong values"},value:false,help:{tr:"Kapalı: Guyton ve Hall (15. baskı). Açık: Ganong (27. baskı). İki kitabın değerleri farklıdır.",en:"Off: Guyton and Hall (15th ed.). On: Ganong (27th ed.). The two books give different values."}};
const bk=(c,g,n)=>c.book?n:g, bkName=c=>c.book?"Ganong":"Guyton";

/* ---------------- BLOKLAR / BLOCKS ---------------- */
const B={
  gauge(v,o={}){
    const mn=o.min??0, mx=o.max??1, f=cl((v-mn)/(mx-mn),0,1), R=70, cx=90, cy=84;
    const pt=a=>[(cx+R*Math.cos(a)).toFixed(1),(cy-R*Math.sin(a)).toFixed(1)];
    const arc=(f0,f1,col)=>{const [x0,y0]=pt(Math.PI*(1-f0)),[x1,y1]=pt(Math.PI*(1-f1)); return `<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}" stroke="var(${col})" stroke-width="14" fill="none"/>`;};
    let a0=0, z=""; (o.zones||[[mx,"--line"]]).forEach(([to,col])=>{const a1=cl((to-mn)/(mx-mn),0,1); if(a1>a0) z+=arc(a0,a1,col); a0=a1;});
    const [nx,ny]=(()=>{const a=Math.PI*(1-f); return [(cx+(R-20)*Math.cos(a)).toFixed(1),(cy-(R-20)*Math.sin(a)).toFixed(1)];})();
    const val=o.fmt?o.fmt(v):pct(v), lab=t(o.label);
    return `<div class="gauge" role="img" aria-label="${lab}: ${val}"><b>${lab}</b><svg viewBox="0 0 180 96" aria-hidden="true">${z}<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"/></svg><div class="gv">${val}</div>${o.sub?`<small>${t(o.sub)}</small>`:""}</div>`;
  },
  bars(title,items){
    return `<div class="bars"><b>${t(title)}</b>${items.map(([l,v,mx,c,txt])=>`<div class="bar"><span>${t(l)}</span><i style="width:${cl(v/mx,0,1)*100}%;background:var(${c||"--h5"})"></i><em>${txt??dec(v)}</em></div>`).join("")}</div>`;
  },
  stack(title,items){
    const tot=items.reduce((a,x)=>a+x[1],0)||1;
    return `<div style="display:grid;gap:6px"><b>${t(title)}</b><div class="stack">${items.map(([l,v,c])=>`<i style="width:${100*v/tot}%;background:var(${c})" title="${t(l)}"></i>`).join("")}</div><div class="legendkey">${items.map(([l,v,c])=>`<span><i class="sw" style="background:var(${c})"></i>${t(l)} ${pct(v/tot)}</span>`).join("")}</div></div>`;
  },
  counter(n,label,sub){ return `<div class="visual"><div class="clock">${n}</div><div><b>${t(label)}</b>${sub?`<br><small style="color:var(--muted)">${t(sub)}</small>`:""}</div></div>`; },
  clock(h,sub){ const hh=Math.floor(h)%24, mm=Math.floor((h-Math.floor(h))*60); return `<div class="visual"><div class="clock">${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}</div>${sub?`<small style="color:var(--muted)">${t(sub)}</small>`:""}</div>`; },
  progress(f,label){ const p=Math.round(cl(f,0,1)*100); return `<div style="display:grid;gap:6px"><b>${t(label)}: ${pct(p/100)}</b><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div></div>`; },
  eq(formula,numbers,note){ return `<div class="eqbox"><div class="eqf">${formula}</div>${numbers?`<div class="eqn">${numbers}</div>`:""}${note?`<small>${t(note)}</small>`:""}</div>`; }
};
const blocks=(...h)=>`<div class="blocks">${h.filter(Boolean).join("")}</div>`;

/* ---------------- MODÜLLER / MODULES ----------------
   Hemoliz, Osmotik Frajilite ve Tamponlama (pratik). 4 modules: tonisite, frajilite, tampon, ph.
   Model numbers (time constants, critical volume, drop counts, protein buffer groups) are simplified;
   book values and pages are in each module note. LAB = value from the department lab manual (pending, Q5-A). */
const M={};
const sp=v=>(v>=0?"+":"−")+pct(Math.abs(v));          // signed percent
const hm=h=>{const hh=Math.floor(h)%24, mm=Math.floor((h-Math.floor(h))*60); return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");};
const PEND=()=>`<p class="src">${L("⚠ Laboratuvar kılavuzu ile kontrol edilecek değerler “(kılavuz)” ile işaretlidir.","⚠ Values marked “(manual)” will be checked against the lab manual.")}</p>`;
const LABT=()=>L(" (kılavuz)"," (manual)");
const phi=z=>1/(1+Math.exp(-1.702*z));               // normal cumulative (logistic approximation)
const BLOOD=a=>`rgba(196,24,40,${cl(a,0,1).toFixed(3)})`;
const BROWN=a=>`rgba(74,40,20,${cl(a,0,1).toFixed(3)})`;   // acid: Fe2+ -> Fe3+, dark product (Ganong ch. 31, PDF p. 787)
const ncl=x=>{const v=x<0.001?"0":dec(x,Math.round(x*100)%10===0?1:2); return LANG==="en"?v+"%":"%"+v;};

/* ---- shared red-cell model (Boyle–van't Hoff; b = non-osmotic volume share) ----
   Volume 1 = normal cell in an isotonic solution. Critical hemolytic volumes are MODEL numbers chosen so that
   normal cells match Ganong (ch. 31, PDF p. 788): lysis begins at 0.5% NaCl, 50% at 0.40–0.42%, complete at 0.35%. */
const RBC={b:0.4, types:[
  {k:"n",tr:"Normal eritrosit",en:"Normal red cell",Vc:1.72,sd:0.115,c:"--h3"},
  {k:"s",tr:"Sferosit",en:"Spherocyte",Vc:1.30,sd:0.07,c:"--signal"},
  {k:"m",tr:"Hipokrom-mikrositer",en:"Hypochromic microcytic",Vc:2.04,sd:0.13,c:"--h5"}]};
const volNaCl=x=>RBC.b+(1-RBC.b)*0.9/Math.max(x,0.01);                 // equilibrium volume in x% NaCl
const hemo=(V,ty)=>V>=9?1:phi((V-ty.Vc)/ty.sd);                         // share of cells lysed at volume V
const hemoNaCl=(x,ty)=>x<=0.001?1:hemo(volNaCl(x),ty);

/* M1 · TONİSİTE VE HEMOLİZ — 6 tubes of 0.3 Osm/L */
const SOL=[
  {tr:"NaCl (%0,9)",en:"NaCl (0.9%)",perm:0,imp:0.3,ptr:"Na⁺ ve Cl⁻ hücreye girmez",pen:"Na⁺ and Cl⁻ do not enter the cell"},
  {tr:"Gliserol",en:"Glycerol",perm:0.3,imp:0,tau:14,ptr:"Gliserol zardan geçer (yavaş)",pen:"Glycerol crosses the membrane (slowly)"},
  {tr:"Üre",en:"Urea",perm:0.3,imp:0,tau:4,ptr:"Üre zardan hızla geçer",pen:"Urea crosses the membrane quickly"},
  {tr:"Na asetat",en:"Na acetate",perm:0,imp:0.3,ptr:"Na⁺ hücreye girmez",pen:"Na⁺ does not enter the cell"},
  {tr:"Asetik asit",en:"Acetic acid",perm:0.3,imp:0,tau:7,acid:true,ptr:"Ayrışmamış asetik asit zardan geçer",pen:"Undissociated acetic acid crosses the membrane",lab:true},
  {tr:"Saf su",en:"Pure water",perm:0,imp:0,ptr:"Dışarıda çözünen madde yok",pen:"No solute outside"}];
M.tonisite={
  tab:{tr:"1 · Tonisite",en:"1 · Tonicity"},
  eyebrow:{tr:"Modül 1 · 0,3 Osm/L çözeltiler",en:"Module 1 · 0.3 Osm/L solutions"},
  title:{tr:"Osmolarite, tonisite ve hemoliz",en:"Osmolarity, tonicity, and hemolysis"},
  sub:{tr:"Tüm çözeltiler izoosmotiktir (0,3 Osm/L). Hücrenin şişip şişmemesini zardan geçemeyen maddeler belirler.",en:"All solutions are isosmotic (0.3 Osm/L). Whether the cell swells depends on the solutes that cannot cross the membrane."},
  card:{tr:"Bir tüp seçin: NaCl, gliserol (gliserin), üre, Na asetat, asetik asit ya da saf su. Hücre hacmini ve hemolizi izleyin.",en:"Choose a tube: NaCl, glycerol, urea, Na acetate, acetic acid, or pure water. Watch the cell volume and hemolysis."},
  init:()=>({V:1,n:0,H:0,sol:-1,tt:0}),
  predict:{q:{tr:"Eritrositler 0,3 Osm/L gliserol çözeltisine konursa hücre hacmi ne olur?",en:"If red cells are placed in a 0.3 Osm/L glycerol solution, what happens to cell volume?"},
    set:{sol:1}, a:"up",
    why:{tr:"Gliserol zardan geçer ve hücre içi osmolariteyi artırır; su hücreye girer, hücre şişer. Çözelti izoosmotiktir ama izotonik değildir (Guyton s. 315; Gena ve ark., 2020).",en:"Glycerol crosses the membrane and raises the osmolarity inside the cell; water enters and the cell swells. The solution is isosmotic but not isotonic (Guyton p. 315; Gena et al., 2020)."}},
  controls:[
    {type:"preset",id:"sol",label:{tr:"Tüp (çözelti)",en:"Tube (solution)"},value:0,options:SOL.map(x=>({label:{tr:x.tr,en:x.en}})),help:{tr:"Her tüpe 3 ml çözelti + 1 damla eritrosit süspansiyonu. Seçim yeni bir tüp başlatır.",en:"Each tube: 3 ml of solution + 1 drop of red-cell suspension. A new choice starts a new tube."}},
    {type:"button",id:"again",label:{tr:"Tüpü yenile",en:"New tube"},act:s=>{s.V=1;s.n=0;s.H=0;s.tt=0;},help:{tr:"Aynı çözeltiyle taze hücreler.",en:"Fresh cells in the same solution."}}
  ],
  step(s,dt,c){
    const S0=SOL[c.sol];
    if(s.sol!==c.sol){ s.sol=c.sol; s.V=1; s.n=0; s.H=0; s.tt=0; }
    s.tt+=dt;
    const w=Math.max(s.V-RBC.b,0.05), out=Math.max(S0.imp+S0.perm,0.004);
    if(S0.perm>0) s.n+=(S0.perm-s.n/w)*w*dt/S0.tau;                        // permeant solute enters
    const Vt=Math.min(RBC.b+(0.3*(1-RBC.b)+s.n)/out,4);
    if(s.H<0.999) s.V=ap(s.V,Vt,0.7,dt);
    s.H=Math.max(s.H,hemo(s.V,RBC.types[0]));
    s.osmIn=(0.3*(1-RBC.b)+s.n)/Math.max(s.V-RBC.b,0.05); s.Vd=Math.min(s.V,2.2);
  },
  rows:(s,c)=>{const S0=SOL[c.sol]; return [[
    {l:L("Çözelti","Solution"),s:L("0,3 Osm/L","0.3 Osm/L"),v:(S0.imp+S0.perm)/0.3,c:"--h1",fmt:()=>t(S0),small:true},
    {l:L("Zardan geçiş","Membrane crossing"),s:L(S0.ptr,S0.pen),v:S0.perm>0?1:0,c:"--h5",fmt:()=>S0.perm>0?L("Geçer","Crosses"):L("Geçmez","No"),small:true},
    {l:L("Hücre içi osmolarite","Osmolarity inside"),s:L("mOsm/L (model)","mOsm/L (model)"),v:cl(s.osmIn/0.6,0,1),c:"--h2",fmt:()=>Math.round(s.osmIn*1000)+""}
  ],[
    {l:L("Su hareketi","Water movement"),s:L("osmozla","by osmosis"),v:0.5,c:"--h1",fmt:()=>s.H>0.98?"—":(s.osmIn>(S0.imp+S0.perm)+0.002||(S0.imp+S0.perm)<0.01?L("İçeri","Inward"):L("Denge","Balance")),small:true},
    {l:L("Hücre hacmi","Cell volume"),s:L("normalin katı","times normal"),v:s.Vd/2.2,c:"--h3",fmt:()=>s.H>0.98?L("parçalandı","lysed"):dec(s.V,2)+"×"},
    {l:L("Hemoliz","Hemolysis"),s:L("parçalanan hücre","cells lysed"),v:s.H,c:"--signal",fmt:()=>pct(s.H)}
  ]];},
  fb:()=>null,
  series:[
    {k:"Vd",n:{tr:"Hücre hacmi (×)",en:"Cell volume (×)"},c:"--h3",min:0.5,max:2.2,primary:true,axis:v=>dec(v,1)+"×",fmt:v=>dec(v,2)+"×",band:[0.95,1.05],bandLabel:{tr:"normal hacim",en:"normal volume"}},
    {k:"H",n:{tr:"Hemoliz",en:"Hemolysis"},c:"--signal",min:0,max:1,fmt:v=>pct(v)}
  ],
  chart:{win:40},
  now(s,c){
    const S0=SOL[c.sol], o=[];
    if(S0.perm===0&&S0.imp>0) o.push(tg("İzotonik","Isotonic")+L(`${t(S0)}: çözünen madde hücreye girmez. Hücre hacmi değişmez, hemoliz olmaz.`,`${t(S0)}: the solute does not enter the cell. Cell volume does not change; no hemolysis.`));
    if(S0.perm>0) o.push(tg("İzoosmotik ama hipotonik","Isosmotic but hypotonic")+L(`${t(S0)} zardan geçer. Hücre içi osmolarite artar, su içeri girer ve hücre şişer.`,`${t(S0)} crosses the membrane. The osmolarity inside rises, water enters, and the cell swells.`));
    if(S0.imp+S0.perm<0.01) o.push(tg("Hipotonik","Hypotonic")+L("Saf suda dışarıda çözünen madde yoktur: su hızla hücreye girer.","Pure water has no solute: water enters the cell quickly."));
    if(s.V>1.3&&s.H<0.98) o.push(tg("Şişme","Swelling")+L("Hücre disk biçiminden küre biçimine geçiyor. Küre, zarın alabileceği en büyük hacimdir.","The cell is changing from a disc to a sphere. The sphere is the largest volume the membrane can hold."));
    if(s.H>0.02&&!S0.acid) o.push(tg("Hemoliz","Hemolysis")+L(`Hücrelerin ${pct(s.H)}'i parçalandı. Hemoglobin çözeltiye geçti; santrifüjden sonra üstteki sıvı kırmızıdır.`,`${pct(s.H)} of the cells have lysed. Hemoglobin has entered the solution; after centrifugation the upper fluid is red.`));
    if(s.H>0.02&&S0.acid) o.push(tg("Hemoliz","Hemolysis")+L(`Hücrelerin ${pct(s.H)}'i parçalandı. Sıvı kahverengi–siyaha döner: asit, hemoglobindeki demiri Fe²⁺'den Fe³⁺'e yükseltger; ürün koyu renklidir (Ganong Böl. 31, PDF s. 787; Boron ve Boulpaep s. 647–648).`,`${pct(s.H)} of the cells have lysed. The fluid turns brown to black: the acid oxidizes the iron in hemoglobin from Fe²⁺ to Fe³⁺; the product is dark (Ganong ch. 31, PDF p. 787; Boron and Boulpaep p. 647–648).`));
    if(S0.lab) o.push(tg("Kılavuz","Manual")+L("Bu tüpün sonucu laboratuvar kılavuzu ile kontrol edilecek.","The result of this tube will be checked against the lab manual."));
    return o;
  },
  visual:(s,c)=>blocks(B.eq(L("Tonisite ← zardan geçemeyen maddeler","Tonicity ← solutes that cannot cross"),L(`Dış: ${Math.round((SOL[c.sol].imp+SOL[c.sol].perm)*1000)} mOsm/L · geçemeyen: ${Math.round(SOL[c.sol].imp*1000)} mOsm/L`,`Outside: ${Math.round((SOL[c.sol].imp+SOL[c.sol].perm)*1000)} mOsm/L · cannot cross: ${Math.round(SOL[c.sol].imp*1000)} mOsm/L`),{tr:"Aynı osmolarite (izoosmotik) her zaman aynı tonisite (izotonik) demek değildir.",en:"The same osmolarity (isosmotic) does not always mean the same tonicity (isotonic)."}),
    B.bars({tr:"6 tüpün sonucu (model)",en:"Result of the 6 tubes (model)"},SOL.map(x=>{const h=(x.perm>0||x.imp+x.perm<0.01)?1:0; return [x,h,1,h?(x.acid?"--acidbrown,#5a3418":"--signal"):"--ok",(h?(x.acid?L("hemoliz var, kahverengi","hemolysis, brown"):L("hemoliz var","hemolysis")):L("hemoliz yok","no hemolysis"))+(x.lab?LABT():"")];}))),
  draw:{h:250,fn(g,W,H,s,c){
    const tx0=W*0.08, tw=Math.min(70,W*0.16), ty=26, th=H-60;
    g.lineWidth=2.5; g.strokeStyle=css("--ink");
    // tube: upper fluid red by hemolysis, pellet of intact cells at the bottom
    const FL=SOL[c.sol].acid?BROWN:BLOOD; g.fillStyle=FL(0.08+0.85*s.H); g.fillRect(tx0,ty+20,tw,th-40);
    const pel=(1-s.H)*28; g.fillStyle=BLOOD(0.95); g.fillRect(tx0,ty+th-20-pel,tw,pel);
    g.beginPath(); g.moveTo(tx0,ty); g.lineTo(tx0,ty+th-20); g.arc(tx0+tw/2,ty+th-20,tw/2,Math.PI,0,true); g.lineTo(tx0+tw,ty); g.stroke();
    g.fillStyle=css("--ink"); g.font=`700 13px ${css("--f-body")}`; g.textAlign="center"; g.fillText(t(SOL[c.sol]),tx0+tw/2,H-8);
    // cell: disc (ellipse) becomes a sphere (circle), then bursts
    const cx=W*0.62, cy=H/2, R0=Math.min(W*0.18,H*0.26);
    if(s.H<0.98){ const f=cl((s.V-1)/0.72,0,1), rx=R0*(1-0.25*f)*Math.cbrt(Math.min(s.V,1.72)), ry=R0*(0.45+0.55*f)*Math.cbrt(Math.min(s.V,1.72))*0.9;
      g.fillStyle=BLOOD(0.85); g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,7); g.fill();
      if(f<0.6){ g.fillStyle=BLOOD(0.5); g.beginPath(); g.ellipse(cx,cy,rx*0.45*(1-f),ry*0.35*(1-f),0,0,7); g.fill(); }
      // water arrows
      const inW=SOL[c.sol].perm>0||SOL[c.sol].imp+SOL[c.sol].perm<0.01;
      if(inW){ g.strokeStyle=css("--h1"); g.lineWidth=2; [0,1,2,3].forEach(k=>{const a=k*Math.PI/2+0.6, r1=R0*1.6, r2=R0*1.2; g.beginPath(); g.moveTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a)); g.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a)); g.stroke();}); }
    } else { g.strokeStyle=BLOOD(0.6); g.lineWidth=2; g.setLineDash([4,4]); g.beginPath(); g.arc(cx,cy,R0*1.15,0,7); g.stroke(); g.setLineDash([]);
      g.fillStyle=BLOOD(0.25); for(let k=0;k<26;k++){ const a=k*2.4, r=R0*(0.4+0.9*((k*37)%10)/10); g.beginPath(); g.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),3,0,7); g.fill(); }
      g.fillStyle=css("--ink"); g.font=`700 14px ${css("--f-body")}`; g.textAlign="center"; g.fillText(L("Hemoliz: zar yırtıldı","Hemolysis: membrane ruptured"),cx,cy+R0*1.6); }
    g.fillStyle=css("--muted"); g.font=`13px ${css("--f-body")}`; g.textAlign="center"; g.fillText(L("Eritrosit (model)","Red cell (model)"),cx,16);
  }},
  daily:{tr:"Damar içine verilen sıvıların osmolaritesi eritrositleri şişirmeyecek ya da büzmeyecek biçimde ayarlanır (Guyton s. 317).",en:"Fluids given into a vein are adjusted so that they do not swell or shrink the red cells (Guyton p. 317)."},
  tasks:{tr:["NaCl ve Na asetat tüplerini karşılaştırın. İkisi de neden hemoliz yapmaz?","Üre ve gliserol tüplerinde hemoliz hızını karşılaştırın. Hangisi daha hızlı?","Saf su tüpünde hemoliz neden en hızlı oluşur?"],
         en:["Compare the NaCl and Na acetate tubes. Why does neither cause hemolysis?","Compare the speed of hemolysis in the urea and glycerol tubes. Which is faster?","Why is hemolysis fastest in the pure-water tube?"]},
  note:()=>L(`<p><strong>Osmolarite:</strong> bir litre çözeltideki osmotik etkin parçacık (osmol) sayısıdır. <strong>Tonisite</strong> ise zardan geçemeyen maddelerin derişimine bağlıdır: izotonik çözelti hücre hacmini değiştirmez, hipotonik çözelti hücreyi şişirir, hipertonik çözelti büzer. Osmolaritesi hücreninkine eşit çözeltiye, madde zardan geçse de geçmese de <strong>izoosmotik</strong> denir (Guyton s. 315). %0,9 NaCl izotoniktir (Guyton s. 315; Ganong Böl. 1, PDF s. 20).</p><p>Üre ve gliserol zardan geçer: hücre içine girdikçe içerideki osmolariteyi artırır, su hücreye girer ve hücre şişer (üre: Boron ve Boulpaep Böl. 5, Şekil 5-18; Guyton s. 315; gliserol: Gena ve ark., 2020). Bu çözeltiler izoosmotik ama hipotoniktir. Şişen eritrosit disk biçiminden küre biçimine geçer ve sonunda hemoglobinini kaybeder; hemoglobin çözeltiyi kırmızıya boyar (Ganong Böl. 31, PDF s. 788).</p><p>Na asetat tüpünde hemoliz olmaz. Asetik asit tüpünde sıvı kahverengi–siyaha döner: asit, hemoglobindeki demiri Fe²⁺'den Fe³⁺'e yükseltger ve koyu renkli bir ürün oluşur (Ganong Böl. 31, PDF s. 787). Asetik asidin zardan geçişinin açıklaması için kaynak eklenecektir${LABT()}.</p><p class="src">Model: hacim, hücrenin osmotik olmayan payı (0,4) ile hesaplanır; kritik hacim ve geçiş hızları basitleştirilmiş sayılardır.</p>`+SRC("Kaynak: Guyton ve Hall (15. baskı), Böl. 25, s. 315, 317; Ganong (27. baskı), Böl. 1, PDF s. 20; Böl. 31, PDF s. 787–788; Boron ve Boulpaep (3. baskı), Böl. 5, Şekil 5-18; Böl. 29, s. 647–648; Gena ve ark. (2020), Bio-protocol 10(16), e3723.","")+PEND(),
             `<p><strong>Osmolarity</strong> is the number of osmotically active particles (osmoles) in one liter of solution. <strong>Tonicity</strong> depends on the concentration of the solutes that cannot cross the membrane: an isotonic solution does not change cell volume, a hypotonic solution swells the cell, and a hypertonic solution shrinks it. A solution with the same osmolarity as the cell is called <strong>isosmotic</strong>, whether or not the solute crosses the membrane (Guyton p. 315). 0.9% NaCl is isotonic (Guyton p. 315; Ganong ch. 1, PDF p. 20).</p><p>Urea and glycerol cross the membrane: as they enter, the osmolarity inside rises, water enters, and the cell swells (urea: Boron and Boulpaep ch. 5, Fig. 5-18; Guyton p. 315; glycerol: Gena et al., 2020). These solutions are isosmotic but hypotonic. A swelling red cell changes from a disc to a sphere and finally loses its hemoglobin, which colors the solution red (Ganong ch. 31, PDF p. 788).</p><p>There is no hemolysis in the Na acetate tube. In the acetic acid tube the fluid turns brown to black: the acid oxidizes the iron in hemoglobin from Fe²⁺ to Fe³⁺, and a dark product forms (Ganong ch. 31, PDF p. 787). A source for how acetic acid crosses the membrane will be added${LABT()}.</p><p class="src">Model: volume is calculated with a non-osmotic share of the cell (0.4); the critical volume and the entry rates are simplified numbers.</p>`+SRC("","Source: Guyton and Hall (15th ed.), ch. 25, p. 315, 317; Ganong (27th ed.), ch. 1, PDF p. 20; ch. 31, PDF p. 787–788; Boron and Boulpaep (3rd ed.), ch. 5, Fig. 5-18; ch. 29, p. 647–648; Gena et al. (2020), Bio-protocol 10(16), e3723.")+PEND())
};

  daily:{tr:"Kalıtsal sferositozda eritrositler küçük ve küreseldir; dalakta sıkışmaya dayanamaz ve parçalanırlar (Guyton s. 454).",en:"In hereditary spherocytosis, red cells are small and spherical; they cannot withstand compression in the spleen and rupture (Guyton p. 454)."},
  tasks:{tr:["Normal hücrede hemolizin başladığı, %50'ye ulaştığı ve tamamlandığı NaCl yüzdelerini bulun.","Hücre tipini “Sferosit” yapın. Aynı tüplerde hemoliz nasıl değişti?","%0,45 NaCl tüpünde üç hücre tipini karşılaştırın."],
         en:["For normal cells, find the NaCl percentages at which hemolysis begins, reaches 50%, and is complete.","Set the cell type to “Spherocyte”. How did hemolysis change in the same tubes?","Compare the three cell types in the 0.45% NaCl tube."]},
  note:()=>L(`<p><strong>Osmotik frajilite</strong> testi, eritrositlerin hipotonik NaCl çözeltilerine direncini ölçer. Hipotonik çözeltide eritrositler şişer, küre biçimini alır ve sonunda hemoglobinlerini kaybeder. Normal eritrositlerde hemoliz <strong>%0,5</strong> NaCl'de başlar, <strong>%0,40–0,42</strong>'de hücrelerin yarısı parçalanır ve <strong>%0,35</strong>'te hemoliz tamamlanır (Ganong Böl. 31, PDF s. 788).</p><p><strong>Kalıtsal sferositoz:</strong> zar iskeleti proteinlerindeki (spektrin, bant 3, ankirin) değişiklikler nedeniyle hücreler küreseldir ve hipotonik NaCl'de daha kolay parçalanır; dalakta da tutulup yıkılırlar (Ganong Böl. 31, PDF s. 788; Guyton s. 454). Sferosit eğrisi yalnızca yönü gösterir; hemolizin başladığı yüzde kitaplarda verilmez. Hipokrom-mikrositer hücrelerin eğrisi için kaynak eklenecektir${LABT()}.</p><p>Tüplerdeki NaCl etkin osmolaritesi, %0,9 NaCl = 286 mOsm/L kabul edilerek hesaplanmıştır (Guyton s. 314–315).</p><p class="src">Model: kritik hacimler normal hücre için Ganong değerlerine uyacak biçimde seçilmiştir; sferosit ve hipokrom eğrileri yalnızca yönü gösterir.</p>`+SRC("Kaynak: Ganong (27. baskı), Böl. 31, PDF s. 788; Guyton ve Hall (15. baskı), Böl. 25, s. 314–315; Böl. 33, s. 454.","")+PEND(),
             `<p>The <strong>osmotic fragility</strong> test measures how well red cells resist hypotonic NaCl solutions. In a hypotonic solution red cells swell, become spherical, and finally lose their hemoglobin. In normal red cells hemolysis begins at <strong>0.5%</strong> NaCl, half of the cells lyse at <strong>0.40–0.42%</strong>, and hemolysis is complete at <strong>0.35%</strong> (Ganong ch. 31, PDF p. 788).</p><p><strong>Hereditary spherocytosis:</strong> because of changes in membrane skeleton proteins (spectrin, band 3, ankyrin), the cells are spherical and lyse more readily in hypotonic NaCl; they are also trapped and destroyed in the spleen (Ganong ch. 31, PDF p. 788; Guyton p. 454). The spherocyte curve shows only the direction; the textbooks do not give the percentage at which lysis begins. A source for the curve of hypochromic microcytic cells will be added${LABT()}.</p><p>The effective osmolarity of the tubes assumes 0.9% NaCl = 286 mOsm/L (Guyton p. 314–315).</p><p class="src">Model: the critical volumes are chosen to match Ganong's values for normal cells; the spherocyte and hypochromic curves show only the direction.</p>`+SRC("","Source: Ganong (27th ed.), ch. 31, PDF p. 788; Guyton and Hall (15th ed.), ch. 25, p. 314–315; ch. 33, p. 454.")+PEND())

/* M3 · PLAZMANIN TAMPON GÜCÜ — drops of 0.1 N HCl or NaOH, water vs 10% plasma */
const DROP=5;                                  // µmol per drop (0.05 ml of 0.1 N)
const PLB=[{T:25,pK:6.1},{T:1,pK:6.8},{T:30,pK:4.2},{T:10,pK:6.5},{T:12,pK:9.6}];   // µmol per 1 ml plasma (MODEL)
const REAG=[{tr:"0,1 N HCl + metil oranj",en:"0.1 N HCl + methyl orange",acid:true,end:3.1},{tr:"0,1 N NaOH + fenolftalein",en:"0.1 N NaOH + phenolphthalein",acid:false,end:8.3}];
const charge=(pH,V,pl,net,SID)=>{ let z=Math.pow(10,-pH)-Math.pow(10,pH-14); if(pl) PLB.forEach(b=>{ z-=b.T/(1+Math.pow(10,b.pK-pH))/V*1e-3; }); return z+(SID+net)/V*1e-3; };
const solvePH=(V,pl,net,SID)=>{ let lo=0,hi=14; for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(charge(m,V,pl,net,SID)>0) lo=m; else hi=m; } return (lo+hi)/2; };
const SID0=(()=>{ const V=10; let z=Math.pow(10,-7.4)-Math.pow(10,7.4-14); PLB.forEach(b=>{ z-=b.T/(1+Math.pow(10,b.pK-7.4))/V*1e-3; }); return -z*V*1e3; })();
const RES={};                                  // endpoint drop counts: key "plasma|reag"
const indColor=(pH,acid)=>acid?(pH<=3.1?"#d0102a":pH<4.4?"#f07b1c":"#f2c418"):(pH>=8.3?"#c21dbf":"rgba(220,230,240,.55)");
M.tampon={
  tab:{tr:"3 · Tampon gücü",en:"3 · Buffer power"},

  card:{tr:"0,1 N HCl + metil oranj ya da 0,1 N NaOH + fenolftalein. Saf su ile %10 plazmayı karşılaştırın.",en:"0.1 N HCl + methyl orange or 0.1 N NaOH + phenolphthalein. Compare pure water with 10% plasma."},

  controls:[

    {type:"preset",id:"rg",label:{tr:"Ayıraç",en:"Reagent"},value:0,options:REAG.map(x=>({label:{tr:x.tr,en:x.en}})),help:{tr:"Her tüpe 5 damla indikatör.",en:"5 drops of indicator in each tube."}},
    {type:"button",id:"drop",label:{tr:"1 damla ekle",en:"Add 1 drop"},act:s=>{ if(s.d<40) s.d++; },help:{tr:"1 damla ≈ 0,05 ml (model).",en:"1 drop ≈ 0.05 ml (model)."}},
    {type:"toggle",id:"auto",label:{tr:"Otomatik damlat",en:"Add drops automatically"},value:false,help:{tr:"Renk değişene kadar her 0,6 saniyede 1 damla.",en:"1 drop every 0.6 s until the color changes."}},
    {type:"button",id:"new",label:{tr:"Yeni tüp",en:"New tube"},act:s=>{ s.d=0; s.done=false; s.acc=0; },help:{tr:"Damla sayısını sıfırlar.",en:"Resets the drop count."}}
  ],
  step(s,dt,c){
    const k=(c.pl?1:0)+"|"+c.rg, R=REAG[c.rg];
    if(s.key!==k){ s.key=k; s.d=0; s.done=false; s.acc=0; }
    if(c.auto&&!s.done&&s.d<40){ s.acc+=dt; if(s.acc>=0.6){ s.acc=0; s.d++; } }
    const V=10+0.05*s.d, net=(R.acid?-1:1)*DROP*s.d;
    s.pH=solvePH(V,c.pl,net,c.pl?SID0:0);
    s.free=R.acid?Math.max(0,(Math.pow(10,-s.pH)-Math.pow(10,-7.4))*V*1e3):Math.max(0,(Math.pow(10,s.pH-14)-Math.pow(10,7.4-14))*V*1e3);
    s.add=DROP*s.d; s.buf=Math.max(0,s.add-s.free);
    const hit=R.acid?s.pH<=R.end:s.pH>=R.end;
    if(hit&&!s.done){ s.done=true; RES[k]=s.d; }
  },
  rows:(s,c)=>{const R=REAG[c.rg]; return [[

function checkQuiz(set,name){
  const nA=set.filter(isAuto).length, sum=r2(set.reduce((a,q)=>a+(q.pts||0),0));
  if(r2(sum+2*nA+4)!==100) console.error(`${name}: item points ${nf(sum)} + 2 × ${nA} automatic items + 4 = ${nf(r2(sum+2*nA+4))}; it must be 100 (default: 84 points in 6 automatic items)`);
  set.forEach((q,i)=>{ const err=m=>console.error(`${name}[${i}] (${q.type}): ${m}`); const L=x=>(tx(x)||[]).length;
    if(!q.pts||q.pts<=0) err("pts missing");
    if(q.type==="order"){ const n=L(q.o); if(n<4||n>7) err("order: use 4–7 rows"); if(r2(q.pts)!==4*(n-1)) err(`order: pts must be 4 × (rows − 1) = ${4*(n-1)} (4 points per consecutive pair)`); }

      if(q.type==="fill"&&n(q.segs)!==q.blanks.length+1) err(`segs.${lg} must have ${q.blanks.length+1} pieces (one more than the blanks)`); });
    if(q.type==="mcq"&&!(q.a>=0&&q.a<L(q.o))) err("a out of range");

    if(q.type==="match"&&(q.a.length!==L(q.left)||q.a.some(k=>k<0||k>=L(q.o)))) err("a must give one option per left item");

  $("#m-chartbox").hidden=!m.series.length;
  $("#m-drawbox").hidden=!m.draw; if(m.draw) $("#draw").style.height=(m.draw.h||260)+"px";
  lastNowHTML=""; renderPredict();
}
function open(key){
  const bm=/^board(\d*)$/.exec(key); if(bm){ showBoard(bm[1]?+bm[1]:1); return; }   // leaderboard for the projector: #board1, #board2 … (#board = round 1)
  const km=/^mid(\d*)$/.exec(key);
  if(MODES.includes("mid")&&(km||key==="mini")){ qmode="mid"; kr=key==="mini"?(NR===1?1:0):km[1]?+km[1]:1; if(kr>NR) kr=0; renderModes(); key="test"; }   // #mid1, #mid2 … (#mid = round 1); #mini = list of rounds
  else if(MODES.includes(key)){ qmode=key; renderModes(); key="test"; }   // QR links: #pre, #post, #late
  if(!M[key]&&key!=="giris"&&key!=="test") key="giris";
  view=key;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.go===key));
  const tb=document.getElementById("t-"+key); if(tb) tb.scrollIntoView({block:"nearest",inline:"nearest"});
  $("#v-giris").hidden=key!=="giris"; $("#v-test").hidden=key!=="test"; $("#v-mod").hidden=!M[key];
  try{ const h=key==="test"?hashOf():key; if(location.hash.slice(1)!==h) history.replaceState(null,"","#"+h); }catch(e){}   // the test tab keeps its mode in the address (#pre, #mid2…), so a reload returns to it
  if(key==="test"){ renderQuiz(); } else testNote();
  if(!M[key]){ cur=null; return; }
  cur=key; modText(); reset();
}
function reset(){ const m=M[cur]; S=m.init(); C=ctlDefaults(m); hist=[]; simT=0; buildControls(m); for(let i=0;i<3;i++) m.step(S,0.05,C); uiTick(true); }
function setLang(l){
  LANG=l; store.set(PFX+"-lang",l); staticText(); renderModes(); testNote();
  if(cur){ modText(); buildControls(M[cur]); uiTick(true); }
  if(view==="test") renderQuiz();
}

function nodeHTML(n){
  const w=cl(n.v,0,1)*100; const val=n.fmt?n.fmt(n.v):pct(n.v);
  return `<div class="node"><div class="nl">${n.l}</div><div class="ns">${n.s}</div><div class="nv${n.small?" sm":""}" style="color:var(${n.c})">${val}</div><div class="meter"><i style="width:${w}%;background:var(${n.c})"></i></div></div>`;
}
let lastNowHTML="";
function uiTick(force){
  if(!cur) return; const m=M[cur];
  $("#m-path").innerHTML=m.rows(S,C).map(r=>`<div class="prow">${r.map(nodeHTML).join('<div class="arrow" aria-hidden="true">→</div>')}</div>`).join("");
  const fb=m.fb(S,C); const fbEl=$("#m-fb");
  if(fb){ fbEl.innerHTML=`<div class="fb ${fb.on?"on":"off"} ${fb.kind}"><span class="dot" style="opacity:${fb.on?0.35+0.65*cl(fb.strength,0,1):1}"></span><span>${fb.text}</span></div>`; } else fbEl.innerHTML="";
  const nh=m.now(S,C).map(p=>`<p>${p}</p>`).join(""); if(nh!==lastNowHTML){$("#m-now").innerHTML=nh; lastNowHTML=nh;}
  $("#m-visual").innerHTML=m.visual?m.visual(S,C):"";
  m.series.forEach(s=>{const el=document.getElementById("lv-"+s.k); if(!el) return; const v=S[s.k]; if(v==null) return; el.textContent=s.fmt?s.fmt(v):pct(v);});
}

/* ---------------- GRAFİK / CHART ---------------- */
const cv=$("#chart"), ctx=cv.getContext("2d");
const winOf=m=>(m.chart&&m.chart.win)||60;
function fitCanvas(c,g){ const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=c.clientHeight; if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);} g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H); return [W,H]; }
function drawChart(){
  if(!cur) return; const m=M[cur]; if(!m.series.length) return;
  const [W,H]=fitCanvas(cv,ctx);
  const padL=46,padR=10,padT=10,padB=26, pw=W-padL-padR, ph=H-padT-padB;
  const ink=css("--muted"), grid=css("--grid"), band=css("--band");
  ctx.font=`12px ${css("--f-mono")}`; ctx.fillStyle=ink; ctx.strokeStyle=grid; ctx.lineWidth=1;
  const P=m.series.find(s=>s.primary)||m.series[0];
  const y=(s,v)=>padT+ph-(cl((v-s.min)/(s.max-s.min),0,1))*ph;
  const day=m.chart&&m.chart.day;
  if(day){ const xd=h=>padL+(h/24)*pw; ctx.fillStyle=grid; (m.chart.night||[]).forEach(([a,b])=>ctx.fillRect(xd(a),padT,xd(b)-xd(a),ph)); }
  if(P.band){ ctx.fillStyle=band; const y1=y(P,P.band[1]), y0=y(P,P.band[0]); ctx.fillRect(padL,y1,pw,y0-y1); ctx.fillStyle=ink; ctx.textAlign="right"; ctx.fillText(t(P.bandLabel)||t(UI.normal),padL+pw-4,y1+13); }
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let i=0;i<=4;i++){ const v=P.min+(P.max-P.min)*i/4, yy=y(P,v); ctx.strokeStyle=grid; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(padL+pw,yy); ctx.stroke(); const lab=P.axis?P.axis(v):""; if(lab!==""){ctx.fillStyle=ink; ctx.fillText(lab,padL-6,yy);} }
  ctx.textBaseline="alphabetic";
  if(P.refs){ P.refs.forEach(r=>{ const yy=y(P,r.v); ctx.strokeStyle=css("--ink"); ctx.globalAlpha=.55; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(padL+pw,yy); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1; ctx.fillStyle=ink; ctx.textAlign="left"; ctx.fillText(t(r.l),padL+6,yy-5); }); }
  ctx.textAlign="center"; ctx.fillStyle=ink;
  if(day){   // 24-hour axis: whole-day curves from m.dayVals, marker at the current hour
    const x=h=>padL+(h/24)*pw;
    for(let h=0;h<=24;h+=6){ ctx.textAlign=h===24?"right":(h===0?"left":"center"); ctx.fillText(String(h%24).padStart(2,"0")+":00",x(h),H-8); }
    if((m.chart.night||[]).length){ ctx.textAlign="left"; ctx.fillText(t(UI.night),x(m.chart.night[0][0])+4,padT+14); }
    m.series.forEach(s=>{ ctx.strokeStyle=css(s.c); ctx.lineWidth=s.primary?3:2; ctx.beginPath(); for(let i=0;i<=192;i++){ const h=i/8, v=m.dayVals(h,C)[s.k], xx=x(h), yy=y(s,v); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); });
    const xh=x(S.h); ctx.strokeStyle=css("--ink"); ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(xh,padT); ctx.lineTo(xh,padT+ph); ctx.stroke(); ctx.setLineDash([]);
    m.series.forEach(s=>{ ctx.fillStyle=css(s.c); ctx.beginPath(); ctx.arc(xh,y(s,S[s.k]),s.primary?4.5:3.5,0,7); ctx.fill(); });
    return;
  }
  const WIN=winOf(m), stepL=WIN<=20?5:WIN<=40?10:15, t1=Math.max(simT,WIN), t0=t1-WIN, x=tt=>padL+((tt-t0)/WIN)*pw;
  const every=pw<340?2:1;   // narrow screens: fewer time labels
  for(let s=0,i=0;s<=WIN;s+=stepL,i++){ if(s!==WIN&&i%every) continue; ctx.textAlign=s===WIN?"right":(s===0?"left":"center"); ctx.fillText((s===WIN?t(UI.nowLbl):"−"+(WIN-s)+" "+t(UI.sec)),padL+(s/WIN)*pw,H-8); } ctx.textAlign="center";
  m.series.forEach(s=>{
    ctx.strokeStyle=css(s.c); ctx.lineWidth=s.primary?3:2; ctx.beginPath(); let st=false;
    for(const p of hist){ if(p.t<t0) continue; const xx=x(p.t), yy=y(s,p[s.k]); st?ctx.lineTo(xx,yy):(ctx.moveTo(xx,yy),st=true); }
    ctx.stroke();
    const lp=hist[hist.length-1]; if(lp){ ctx.fillStyle=css(s.c); ctx.beginPath(); ctx.arc(x(lp.t),y(s,lp[s.k]),s.primary?4.5:3.5,0,7); ctx.fill(); }
  });
}
/* ---------------- ÇİZİM ALANI / DRAWING AREA ---------------- */
const dv=$("#draw"), dctx=dv.getContext("2d");
function drawPanel(){ if(!cur) return; const m=M[cur]; if(!m.draw) return; const [W,H]=fitCanvas(dv,dctx); dctx.save(); m.draw.fn(dctx,W,H,S,C); dctx.restore(); }

/* ---------------- DÖNGÜ / LOOP ---------------- */
function loop(ts){
  const dtReal=last?Math.min(0.1,(ts-last)/1000):0; last=ts;
  if(cur&&!paused){
    const m=M[cur]; let dt=dtReal*speed; const n=Math.max(1,Math.ceil(dt/0.05));
    for(let i=0;i<n;i++){ m.step(S,dt/n,C); simT+=dt/n; }
    if(!(m.chart&&m.chart.day)){ const p={t:simT}; m.series.forEach(s=>p[s.k]=S[s.k]); hist.push(p); const W=winOf(m); while(hist.length&&hist[0].t<simT-W-2) hist.shift(); }
    uiAcc+=dtReal; if(uiAcc>0.15){uiAcc=0; uiTick();}
  }
  drawChart(); drawPanel();
  requestAnimationFrame(loop);
}
$("#b-pause").onclick=()=>{paused=!paused; $("#b-pause").textContent=paused?t(UI.resume):t(UI.pause);};
$("#b-reset").onclick=()=>reset();
document.querySelectorAll("#speed button").forEach(b=>b.onclick=()=>{speed=+b.dataset.s; document.querySelectorAll("#speed button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"); if(!g) return; e.preventDefault(); if(g.dataset.mode&&MODES.includes(g.dataset.mode)){qmode=g.dataset.mode; renderModes();} open(g.dataset.go); window.scrollTo({top:0});});
window.addEventListener("hashchange",()=>open(location.hash.slice(1)));
staticText();
open(location.hash.slice(1)||"giris");
requestAnimationFrame(loop);
})();

</script>
</body></html>
